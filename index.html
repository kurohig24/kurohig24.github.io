<script>
  // ========== KONFIGURASI ==========
  const API_ENDPOINT = "https://api.ahwanulm.me/v1";
  const API_KEY = "sk-fae1327aa9f2c80b-xtrat0-faf14a55";
  let currentModel = "kr/claude-opus-4.7";
  
  let uploadedFile = null;
  let conversationHistory = [{ role: "system", content: `Kamu adalah ARUL AI, Asisten Universal yang sangat cerdas dan fleksibel. Kamu bisa melakukan APAPUN yang diminta pengguna:

  KEMAMPUAN UTAMA:
  1. MEMBACA & MENGANALISIS FILE: PDF, Excel, Word, PPT, Gambar (OCR). Ekstrak konten dan jawab pertanyaan.
  2. MEMBUAT FILE: DOC, PDF, XLSX, PPT berdasarkan deskripsi. Untuk membuat file, kembalikan JSON: {"fileType":"doc/pdf/xlsx/ppt","fileName":"nama","content":"isi"}.
  3. MEREVISI FILE: Upload file lalu minta revisi.
  4. ANALISIS DATA: Dari Excel/CSV, berikan statistik, insight, tren, rekomendasi.
  5. PENERJEMAHAN: Terjemahkan teks/dokumen ke berbagai bahasa.
  6. CODING: Buat kode Python, JavaScript, HTML, SQL, dll. Sertakan penjelasan.
  7. SURAT & DOKUMEN RESMI: Surat lamaran, proposal, undangan, kontrak, dll.
  8. PENJELASAN KONSEP: Jelaskan topik rumit dengan analogi sederhana dan contoh.
  
  Aturan Respons:
  - Gunakan Bahasa Indonesia yang baik dan benar
  - Respons dengan format MARKDOWN, gunakan tabel untuk data, gunakan code block untuk kode
  - Jika membuat file, pastikan JSON valid
  - Bersikap ramah, profesional, dan helpful seperti Claude AI
  - Adaptif: lakukan sesuai perintah tanpa perlu konfirmasi ulang` }];
  
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  
  // ========== EKSTRAKSI FILE ==========
  async function extractFileContent(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'pdf') {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let text = '';
      for (let i = 1; i <= Math.min(pdf.numPages, 20); i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(' ') + '\n';
      }
      return `📄 FILE PDF: ${file.name}\nJUMLAH HALAMAN: ${pdf.numPages}\n\nKONTEN:\n${text.substring(0, 8000)}`;
    }
    if (['xlsx','xls','csv'].includes(ext)) {
      const arrayBuffer = await file.arrayBuffer();
      const workbook = XLSX.read(arrayBuffer);
      let result = `📊 FILE EXCEL: ${file.name}\nJUMLAH SHEET: ${workbook.SheetNames.length}\n\n`;
      workbook.SheetNames.forEach(sheet => {
        const data = XLSX.utils.sheet_to_json(workbook.Sheets[sheet], { header: 1 });
        result += `=== SHEET: ${sheet} ===\n`;
        if (data.length > 0) {
          const headers = data[0] || [];
          result += `KOLOM: ${headers.join(', ')}\n`;
          result += `JUMLAH BARIS DATA: ${data.length - 1}\n`;
          result += `PREVIEW (5 baris pertama):\n${JSON.stringify(data.slice(0, 6), null, 2)}\n`;
        }
        result += '\n';
      });
      return result.substring(0, 8000);
    }
    if (ext === 'docx') {
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer });
      return `📝 FILE WORD: ${file.name}\n\nKONTEN:\n${result.value.substring(0, 8000)}`;
    }
    if (ext === 'pptx') {
      return `📽️ FILE POWERPOINT: ${file.name}\nUkuran: ${(file.size/1024).toFixed(1)} KB\n(Catatan: Untuk analisis terbaik, konversi ke PDF terlebih dahulu)`;
    }
    if (['png','jpg','jpeg','bmp','webp'].includes(ext)) {
      const url = URL.createObjectURL(file);
      try {
        const { data: { text } } = await Tesseract.recognize(url, 'ind+eng');
        URL.revokeObjectURL(url);
        return `🖼️ FILE GAMBAR: ${file.name}\n\nHASIL OCR (TEKS DALAM GAMBAR):\n${text.substring(0, 5000) || '(Tidak ada teks terdeteksi)'}`;
      } catch(err) {
        URL.revokeObjectURL(url);
        return `🖼️ FILE GAMBAR: ${file.name}\nUkuran: ${(file.size/1024).toFixed(1)} KB\n(Gagal OCR: ${err.message})`;
      }
    }
    if (ext === 'txt') {
      const text = await file.text();
      return `📄 FILE TEKS: ${file.name}\n\nKONTEN:\n${text.substring(0, 8000)}`;
    }
    return `FILE: ${file.name}\nUkuran: ${(file.size/1024).toFixed(1)} KB`;
  }
  
  // ========== GENERATE FILE ==========
  function generateDocFile(content, filename) {
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${filename}</title><style>body{font-family:Arial,sans-serif;padding:40px;max-width:800px;margin:0 auto;line-height:1.6;}h1{color:#2c3e50;}h2{color:#34495e;}table{border-collapse:collapse;width:100%;margin:15px 0;}th,td{border:1px solid #ddd;padding:8px;text-align:left;}th{background:#f5f5f5;}pre{background:#f4f4f4;padding:10px;overflow-x:auto;}code{font-family:monospace;}</style></head><body>${content}</body></html>`;
    const blob = htmlDocx.asBlob(html);
    return { url: URL.createObjectURL(blob), filename: `${filename}.docx`, type: 'docx' };
  }
  
  function generatePDFFromContent(content, filename) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const plainText = content.replace(/<[^>]*>/g, '');
    const lines = doc.splitTextToSize(plainText, 170);
    let y = 20;
    for (let line of lines) {
      if (y > 280) { doc.addPage(); y = 20; }
      doc.text(line, 15, y);
      y += 7;
    }
    return { url: URL.createObjectURL(doc.output('blob')), filename: `${filename}.pdf`, type: 'pdf' };
  }
  
  function generateExcelFile(data, filename) {
    let wsData;
    if (typeof data === 'string') {
      try { wsData = JSON.parse(data); } catch(e) { wsData = [[data]]; }
    } else {
      wsData = data;
    }
    if (!Array.isArray(wsData[0])) wsData = [wsData];
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Data');
    const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
    return { url: URL.createObjectURL(new Blob([buf], {type: 'application/octet-stream'})), filename: `${filename}.xlsx`, type: 'xlsx' };
  }
  
  async function handleCreateFile(userMessage) {
    showLoading("📝 AI sedang membuat file...");
    const messages = [...conversationHistory, { role: "user", content: `BUAT FILE: ${userMessage}. Kembalikan JSON valid: {"fileType":"doc/pdf/xlsx/ppt","fileName":"nama_file","content":"isi_konten"}. Untuk Excel, content berupa array 2D. Untuk file lain, content berupa HTML atau markdown.` }];
    try {
      const res = await fetch(`${API_ENDPOINT}/chat/completions`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
        body: JSON.stringify({ model: currentModel, messages, stream: false, max_tokens: 4000 })
      });
      if (!res.ok) throw new Error(`API error ${res.status}`);
      const data = await res.json();
      let aiResponse = data.choices[0].message.content;
      
      let fileData = { fileType: 'doc', fileName: 'dokumen', content: aiResponse };
      const jsonMatch = aiResponse.match(/\{[\s\S]*\}/);
      if (jsonMatch) {
        try { fileData = JSON.parse(jsonMatch[0]); } catch(e) {}
      }
      
      let result;
      if (fileData.fileType === 'xlsx' || userMessage.toLowerCase().includes('excel')) {
        result = generateExcelFile(fileData.content || [[fileData.fileName], [fileData.content]], fileData.fileName);
      } else if (fileData.fileType === 'pdf' || userMessage.toLowerCase().includes('pdf')) {
        result = generatePDFFromContent(fileData.content, fileData.fileName);
      } else {
        result = generateDocFile(fileData.content, fileData.fileName);
      }
      
      hideLoading();
      const icon = result.type === 'docx' ? 'fa-file-word' : (result.type === 'pdf' ? 'fa-file-pdf' : 'fa-file-excel');
      addMessageToUI('assistant', `✅ **File "${result.filename}" berhasil dibuat!**\n\n<div class="file-download-card"><i class="fas ${icon} fa-2x"></i><div><strong>${result.filename}</strong><br>Klik tombol di bawah untuk menyimpan</div><a href="${result.url}" download="${result.filename}" class="download-btn"><i class="fas fa-download"></i> Download File</a></div>\n\n📄 **Preview:**\n${aiResponse.substring(0, 800)}`);
    } catch(err) {
      hideLoading();
      addMessageToUI('assistant', `❌ Gagal membuat file: ${err.message}`);
    }
  }
  
  async function analyzeFile(file, question) {
    showLoading("🔍 AI sedang membaca & menganalisis file...");
    const content = await extractFileContent(file);
    const messages = [...conversationHistory, { role: "user", content: `FILE: ${file.name}\n\nKONTEN FILE:\n${content}\n\nPERINTAH: ${question}\n\nLakukan sesuai perintah. Jika diminta ringkasan, berikan ringkasan. Jika diminta analisis data, berikan insight. Jika diminta revisi, hasilkan file revisi dalam JSON.` }];
    try {
      const res = await fetch(`${API_ENDPOINT}/chat/completions`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
        body: JSON.stringify({ model: currentModel, messages, stream: false, max_tokens: 3000 })
      });
      if (!res.ok) throw new Error(`API error ${res.status}`);
      const data = await res.json();
      const reply = data.choices[0].message.content;
      hideLoading();
      addMessageToUI('assistant', reply);
      conversationHistory.push({ role: "user", content: `[FILE: ${file.name}] ${question}` }, { role: "assistant", content: reply });
    } catch(err) {
      hideLoading();
      addMessageToUI('assistant', `❌ Error: ${err.message}`);
    }
  }
  
  async function sendRegularMessage(question) {
    showLoading("💭 AI sedang berpikir...");
    const messages = [...conversationHistory, { role: "user", content: question }];
    try {
      const res = await fetch(`${API_ENDPOINT}/chat/completions`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
        body: JSON.stringify({ model: currentModel, messages, stream: false, max_tokens: 2500 })
      });
      if (!res.ok) throw new Error(`API error ${res.status}`);
      const data = await res.json();
      const reply = data.choices[0].message.content;
      hideLoading();
      addMessageToUI('assistant', reply);
      conversationHistory.push({ role: "user", content: question }, { role: "assistant", content: reply });
      if (conversationHistory.length > 30) conversationHistory = conversationHistory.slice(-25);
    } catch(err) {
      hideLoading();
      addMessageToUI('assistant', `❌ Error: ${err.message}. Cek koneksi atau coba model lain.`);
    }
  }
  
  // ========== UI HELPERS ==========
  const messagesContainer = document.getElementById('messagesContainer');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const attachBtn = document.getElementById('attachButton');
  const fileInput = document.getElementById('fileInput');
  
  function scrollToBottom() { messagesContainer.scrollTop = messagesContainer.scrollHeight; }
  function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])) || ''; }
  function renderMarkdown(text) { 
    try { 
      let html = marked.parse(text); 
      setTimeout(() => document.querySelectorAll('pre code').forEach(hljs.highlightElement), 100); 
      return html; 
    } catch(e) { return text.replace(/\n/g, '<br>'); } 
  }
  
  function addMessageToUI(role, content) {
    const div = document.createElement('div');
    div.className = `message ${role === 'user' ? 'user-message' : 'assistant-message'}`;
    div.innerHTML = `<div class="bubble">${role === 'assistant' ? renderMarkdown(content) : escapeHtml(content)}</div>`;
    messagesContainer.appendChild(div);
    scrollToBottom();
  }
  
  let loadingDiv = null, loadingInterval = null;
  const emoticons = ["🤔", "🧐", "📖", "🔍", "🤖✨", "📊", "✏️", "💭", "🚀", "⭐", "💡", "🎯"];
  function showLoading(text = "Memproses...") {
    if (loadingDiv) return;
    loadingDiv = document.createElement('div');
    loadingDiv.className = 'message assistant-message';
    let idx = 0;
    const update = () => { if(loadingDiv) loadingDiv.innerHTML = `<div class="bubble"><div class="loading-emoticon"><span class="loading-spinner-custom">${emoticons[idx%emoticons.length]}</span> ${text}</div></div>`; idx++; };
    update();
    messagesContainer.appendChild(loadingDiv);
    scrollToBottom();
    loadingInterval = setInterval(update, 600);
  }
  function hideLoading() { if(loadingInterval) clearInterval(loadingInterval); if(loadingDiv) loadingDiv.remove(); loadingDiv = null; }
  
  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    uploadedFile = file;
    const panel = document.getElementById('activeFilePanel');
    panel.style.display = 'flex';
    panel.innerHTML = `<span><i class="fas fa-file"></i> <strong>${file.name}</strong> sudah diupload</span><button id="removeFileBtn" class="remove-file-btn"><i class="fas fa-times"></i> Hapus</button>`;
    document.getElementById('removeFileBtn')?.addEventListener('click', () => { uploadedFile = null; panel.style.display = 'none'; addMessageToUI('assistant', '🗑️ File dihapus. Upload lagi jika perlu.'); });
    addMessageToUI('user', `📎 Upload file: ${file.name}`);
    await analyzeFile(file, "Buat ringkasan singkat isi file ini dan beri tahu aku bisa bertanya apa saja tentang file ini.");
    fileInput.value = '';
  });
  
  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) { alert("Ketik perintah!"); return; }
    addMessageToUI('user', text);
    userInput.value = '';
    userInput.style.height = 'auto';
    
    const createKeywords = ['buat', 'buatkan', 'generate', 'bikin', 'create', 'buat file'];
    const isCreate = createKeywords.some(k => text.toLowerCase().includes(k)) && 
                     (text.toLowerCase().includes('makalah') || text.toLowerCase().includes('excel') || 
                      text.toLowerCase().includes('presentasi') || text.toLowerCase().includes('ppt') || 
                      text.toLowerCase().includes('surat') || text.toLowerCase().includes('laporan') ||
                      text.toLowerCase().includes('dokumen') || text.toLowerCase().includes('proposal'));
    
    if (isCreate) {
      await handleCreateFile(text);
    } else if (uploadedFile) {
      await analyzeFile(uploadedFile, text);
    } else {
      await sendRegularMessage(text);
    }
  }
  
  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
  userInput.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(100, this.scrollHeight) + 'px'; });
  modelSelect.addEventListener('change', (e) => { currentModel = e.target.value; addMessageToUI('assistant', `🔄 Model AI diubah ke ${currentModel}`); });
  
  document.getElementById('newChatBtn')?.addEventListener('click', () => {
    messagesContainer.innerHTML = '';
    conversationHistory = [{ role: "system", content: conversationHistory[0].content }];
    uploadedFile = null;
    document.getElementById('activeFilePanel').style.display = 'none';
    addMessageToUI('assistant', "✨ Chat baru! Kirim perintah apapun, aku akan bantu.");
  });
  document.getElementById('clearChatBtn')?.addEventListener('click', () => {
    messagesContainer.innerHTML = '';
    conversationHistory = [{ role: "system", content: conversationHistory[0].content }];
    addMessageToUI('assistant', "🧹 Riwayat chat dihapus.");
  });
  
  scrollToBottom();
</script>
</body>
</html>
